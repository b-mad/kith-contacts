name: Release

# Push a tag such as v1.0.0 to build the install zip from that commit and attach it to a
# GitHub Release (I-13, N-13). The tag must match the version in pyproject.toml, and the
# tagged commit must already be on main, where CI has run.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Tag must match the app version and be on main
        run: |
          version="$(uv run python -c 'from app.version import app_version; print(app_version())')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tagged commit is not on main" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - run: uv sync --locked

      - name: Build the install zip
        run: make bundle

      - name: Checksum and release notes
        run: |
          cd dist
          zip="Kith-Contacts-${VERSION}.zip"
          test -f "${zip}"
          sha256sum "${zip}" > "${zip}.sha256"
          {
            echo "Install zip for Kith Contacts ${VERSION}. Unzip it and follow **Start here.html**."
            echo
            echo "Licence: Apache-2.0. Third-party notices are inside the zip (THIRD_PARTY_NOTICES)."
            echo
            echo "SHA-256 of ${zip}:"
            echo
            echo '```'
            cat "${zip}.sha256"
            echo '```'
          } > ../release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/Kith-Contacts-${VERSION}.zip" \
            "dist/Kith-Contacts-${VERSION}.zip.sha256" \
            --title "Kith Contacts ${VERSION}" \
            --notes-file release-notes.md \
            --verify-tag
