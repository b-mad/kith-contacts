[project]
name = "kith-contacts"
version = "1.0.0"
description = "Locally hosted contact manager for finding people by context."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES"]
authors = [{ name = "Bryan Madsen" }]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "numpy>=2.5.3",
    # No onnxruntime build exists for Intel Macs; search by meaning is then unavailable (ADR-0013).
    "onnxruntime>=1.30.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "phonenumbers>=8.13",
    "pillow>=11",
    "psycopg[binary]>=3.2",
    "pycountry>=24.6",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.36",
    "tokenizers>=0.23.2",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.32",
    "zipcodes>=3.0",
]

[dependency-groups]
dev = [
    "axe-playwright-python>=0.1.8",
    "httpx2>=0.1",
    "markdown>=3.11",
    "mypy>=1.13",
    "playwright>=1.49",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-markdown>=3.10.2.20260712",
]

[tool.uv]
package = false

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "S",             # bandit (security)
    "SIM",           # simplify
    "RUF",
    "PT",            # pytest style
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501"]  # long sample-data literals are fine in tests
"migrations/**" = ["E501"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^migrations/versions/"]

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["axe_playwright_python", "axe_playwright_python.*"]  # no type hints shipped
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=app",
    "--cov=scripts",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=80",
    "-m", "not e2e and not model",
]
markers = [
    "req(id): the requirement ID(s) from docs/requirements.md this test verifies",
    "e2e: browser end-to-end tests (run with: make e2e)",
    "model: tests with the real search-by-meaning model (run with: make test-model)",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
omit = ["app/__main__.py"]
