<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Contacts{% endblock %} · {{ instance.instance_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <link rel="stylesheet" href="{{ url_for('instance_css') }}">
  <script src="{{ url_for('static', path='js/app.js') }}" defer></script>
</head>
<body class="env-{{ instance.app_env }}">
  <header class="instance-bar" data-testid="instance-bar">
    <a class="brand" href="/">Contacts</a>
    <span class="instance-name" data-testid="instance-name">{{ instance.instance_name }}</span>
    <nav class="bar-nav" aria-label="Main">
      <a href="/lists" data-testid="nav-lists">Lists</a>
      <a href="/tags" data-testid="nav-tags">Tags</a>
      <a href="/org" data-testid="nav-org">Org</a>
      <a href="/settings" data-testid="nav-settings">Settings</a>
    </nav>
    <nav class="bar-actions">
      <a class="bar-link" href="/contacts/new" data-testid="nav-add">+ Add contact</a>
      {% if not instance.is_production %}
        <span class="env-badge" data-testid="env-badge">{{ instance.app_env | upper }}</span>
      {% endif %}
    </nav>
  </header>
  <main>
    {% if notice %}<p class="flash" role="status" data-testid="flash">{{ notice }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
