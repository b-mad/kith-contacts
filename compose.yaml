# Contact Manager: container install (I-10, ADR-0019).
#
# Normally started by "Start Contact Manager", which runs:
#   docker compose --project-name contact-manager --env-file "<home>/Contact Manager/settings.env" \
#     -f compose.yaml up -d --build --wait
# with APP_VERSION (from pyproject.toml) and CONTACTS_BACKUPS (<home>/Contact Manager/Backups)
# set in the environment. settings.env chooses the contact books (COMPOSE_PROFILES=work,personal)
# and their names, colors, contact types and ports; it holds no passwords.
#
# Development keeps using docker-compose.db.yml and ./run.sh.

name: contact-manager

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-image: &image
  image: contact-manager:${APP_VERSION:-dev}
  pull_policy: never

x-instance: &instance
  <<: *image
  # The start scripts pass the computer's own user (macOS, Linux) so the app may write to the
  # shared backup folder; otherwise the image's unprivileged user.
  user: "${APP_UID:-10001}:${APP_GID:-10001}"
  restart: unless-stopped
  depends_on:
    setup:
      condition: service_completed_successfully
  networks: [backend, frontend]
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  stop_grace_period: 20s
  logging: *logging

x-instance-env: &instance-env
  APP_ENV: production
  PHONE_REGION: ${PHONE_REGION:-US}
  BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-}
  SEMANTIC_SEARCH: ${SEMANTIC_SEARCH:-}
  RESTORE_ON_EMPTY: "1" # I-12: a new, empty database starts from the newest backup in its folder

services:
  # One-shot: the database admin password, generated once into a volume (never a file you see).
  secrets:
    <<: *image
    pull_policy: build
    build:
      context: .
      network: ${BUILD_NETWORK:-default}
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-trixie}
        PG_MAJOR: ${PG_MAJOR:-17}
        WITH_MODEL: ${WITH_MODEL:-1}
    command: ["secrets"]
    network_mode: none
    restart: "no"
    volumes:
      - db-secrets:/run/contacts/db
    logging: *logging

  db:
    image: ${POSTGRES_IMAGE:-postgres:17-trixie}
    restart: unless-stopped
    depends_on:
      secrets:
        condition: service_completed_successfully
    environment:
      POSTGRES_PASSWORD_FILE: /run/contacts/db/postgres-password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - db-secrets:/run/contacts/db:ro
    networks: [backend] # internal network only: no port on this computer (N-04)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 60
    logging: *logging

  # One-shot: each chosen contact book's database and role (I-02), created or repaired.
  setup:
    <<: *image
    command: ["setup"]
    user: root # only to hand the backup folders to the app user; exits when done
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      CONTACTS_INSTANCES: ${COMPOSE_PROFILES:-work}
      APP_UID: ${APP_UID:-10001}
      APP_GID: ${APP_GID:-10001}
    volumes:
      - db-secrets:/run/contacts/db:ro
      - work-instance:/run/contacts/instances/work
      - personal-instance:/run/contacts/instances/personal
      - type: bind
        source: ${CONTACTS_BACKUPS:?run Start Contact Manager}
        target: /backups
        bind:
          # the Start scripts create it on this computer; Docker Desktop creating it (as root)
          # leaves it unwritable for the app at first start
          create_host_path: false
    networks: [backend]
    logging: *logging

  work:
    <<: *instance
    profiles: [work]
    environment:
      <<: *instance-env
      INSTANCE_NAME: ${WORK_NAME:-Work}
      INSTANCE_COLOR: ${WORK_COLOR:-#1f6feb}
      CONTACT_TYPES: ${WORK_TYPES:-Employee,Customer,Vendor}
      HOME_COMPANY: ${WORK_HOME_COMPANY:-}
      DEFAULT_PALETTE: ${WORK_PALETTE:-}
      PORT: ${WORK_PORT:-5170}
    ports:
      - "127.0.0.1:${WORK_PORT:-5170}:${WORK_PORT:-5170}" # this computer only (N-01)
    volumes:
      - work-instance:/run/contacts/instance:ro
      - type: bind
        source: ${CONTACTS_BACKUPS:?run Start Contact Manager}/work
        target: /backups
        bind:
          # the Start scripts create it on this computer; Docker Desktop creating it (as root)
          # leaves it unwritable for the app at first start
          create_host_path: false

  personal:
    <<: *instance
    profiles: [personal]
    environment:
      <<: *instance-env
      INSTANCE_NAME: ${PERSONAL_NAME:-Personal}
      INSTANCE_COLOR: ${PERSONAL_COLOR:-#8250df}
      CONTACT_TYPES: ${PERSONAL_TYPES:-Family,Friend,Service provider}
      HOME_COMPANY: ${PERSONAL_HOME_COMPANY:-}
      DEFAULT_PALETTE: ${PERSONAL_PALETTE:-}
      PORT: ${PERSONAL_PORT:-5171}
    ports:
      - "127.0.0.1:${PERSONAL_PORT:-5171}:${PERSONAL_PORT:-5171}"
    volumes:
      - personal-instance:/run/contacts/instance:ro
      - type: bind
        source: ${CONTACTS_BACKUPS:?run Start Contact Manager}/personal
        target: /backups
        bind:
          # the Start scripts create it on this computer; Docker Desktop creating it (as root)
          # leaves it unwritable for the app at first start
          create_host_path: false

networks:
  backend:
    internal: true
  frontend: {}

volumes:
  pgdata:
  db-secrets:
  work-instance:
  personal-instance:
