# Installed by `make install`. Runs on every commit; CI runs the full `make check`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-lint
        name: ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: uv run mypy app scripts tests
        language: system
        types: [python]
        pass_filenames: false
      - id: no-instance-env
        name: block committed instance env files (credentials)
        entry: instance env files must not be committed
        language: fail
        files: ^instances/(?!example\.env$).*\.env$
      - id: conventional-commit
        name: conventional commit message
        entry: python3 -c "import re,sys; m=open(sys.argv[1]).read(); sys.exit(0 if re.match(r'^(feat|fix|docs|test|refactor|perf|build|ci|chore|revert)(\([\w-]+\))?!?:\s.+', m) or m.startswith(('Merge','Revert')) else 'Commit message must follow Conventional Commits, e.g. feat(contacts): add manager picker [C-07]')"
        language: system
        stages: [commit-msg]
